  <!-- MathJax for LaTeX equations -->
  <script>
  MathJax = {
    tex: {
      inlineMath: [['\\(', '\\)']],
      displayMath: [['\\[', '\\]']],
      tags: 'ams',
      packages: {'[+]': ['ams']}
    },
    options: {
      skipHtmlTags: ['script','noscript','style','textarea','pre']
    }
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    .thesis-wrap {
      max-width: 700px;
      padding: 4rem 2rem 6rem;
      margin: 0 auto;
    }

    .chapter-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 0;
      border-bottom: 1px solid var(--rule);
      margin-bottom: 3rem;
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--ink-muted);
    }
    .chapter-nav a { color: var(--accent); text-decoration: none; }
    .chapter-nav a:hover { text-decoration: underline; }

    /* Body text */
    .thesis-wrap p {
      color: var(--ink-soft);
      font-size: 0.95rem;
      line-height: 1.85;
      margin-bottom: 1.1rem;
    }
    .thesis-wrap h1 {
      font-size: 1.75rem;
      font-weight: 300;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
      margin-top: 3rem;
      text-transform: lowercase;
      color: var(--ink);
    }
    .thesis-wrap h2 {
      font-size: 1.1rem;
      font-weight: 500;
      margin-top: 2.5rem;
      margin-bottom: 0.6rem;
      text-transform: lowercase;
      color: var(--ink);
      letter-spacing: 0;
    }
    .thesis-wrap h3 {
      font-size: 0.95rem;
      font-weight: 500;
      margin-top: 1.75rem;
      margin-bottom: 0.4rem;
      color: var(--ink);
      text-transform: lowercase;
    }


    /* ── Improved figure layout ── */
    .thesis-wrap figure {
      margin: 2.5rem auto;
      text-align: center;
      max-width: 100%;
    }

    /* Subfigure grids — pandoc wraps these in nested figures */
    .thesis-wrap figure > figure {
      display: inline-block;
      vertical-align: top;
      margin: 0.5rem;
      max-width: 48%;
    }

    .thesis-wrap figure img {
      max-width: 100%;
      height: auto;
      border-radius: 2px;
      display: block;
      margin: 0 auto;
    }

    .thesis-wrap figcaption {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--ink-muted);
      margin-top: 0.75rem;
      line-height: 1.6;
      text-align: left;
      max-width: 560px;
      margin-left: auto;
      margin-right: auto;
    }

    /* Figure numbers bold */
    .thesis-wrap figcaption strong { color: var(--ink-soft); }

    /* Tables */
    .thesis-wrap table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      margin: 2rem auto;
      color: var(--ink-soft);
      display: block;
      overflow-x: auto;
    }
    .thesis-wrap th {
      font-weight: 500;
      color: var(--ink);
      border-bottom: 2px solid var(--rule);
      border-top: 1px solid var(--rule);
      padding: 0.5rem 0.75rem;
      text-align: left;
      white-space: nowrap;
    }
    .thesis-wrap td {
      border-bottom: 1px solid var(--rule);
      padding: 0.4rem 0.75rem;
    }

    /* Math display breathing room */
    .thesis-wrap .math.display {
      overflow-x: auto;
      margin: 1.75rem 0;
      padding: 0.5rem 0;
      text-align: center;
    }
    .thesis-wrap .math.inline { font-size: 0.95em; }

    /* Block quotes / epigraphs */
    .thesis-wrap blockquote {
      border-left: 2px solid var(--accent);
      padding: 0.5rem 1.25rem;
      margin: 1.5rem 0;
      color: var(--ink-muted);
      font-style: italic;
    }

    /* Lists */
    .thesis-wrap ul, .thesis-wrap ol {
      color: var(--ink-soft);
      padding-left: 1.5rem;
      margin-bottom: 1rem;
      line-height: 1.8;
    }

    /* Footnotes */
    .thesis-wrap .footnotes {
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--rule);
      font-size: 0.8rem;
      color: var(--ink-muted);
    }
    .thesis-wrap .footnotes ol { font-size: 0.8rem; }

    /* Bibliography entries */
    .thesis-wrap .csl-bib-body { font-size: 0.85rem; line-height: 1.7; }
    .thesis-wrap .csl-entry {
      color: var(--ink-soft);
      margin-bottom: 1.1rem;
      padding-left: 1.75rem;
      text-indent: -1.75rem;
    }
    .thesis-wrap .csl-entry a { color: var(--accent); word-break: break-all; }

    /* Citations inline */
    .thesis-wrap .citation { color: var(--accent); font-size: 0.9em; }
    .thesis-wrap .citation a { color: var(--accent); }

    /* Code/verbatim */
    .thesis-wrap pre, .thesis-wrap code {
      font-family: var(--mono);
      font-size: 0.82em;
      background: #f5f5f7;
      border-radius: 2px;
    }
    .thesis-wrap pre {
      padding: 1rem 1.25rem;
      overflow-x: auto;
      margin: 1rem 0;
    }

  </style>
</head>
