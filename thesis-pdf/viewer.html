<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>thesis — aashrita mangu</title>
  <link rel="stylesheet" href="../assets/style.css" />
  <style>
    body { margin: 0; background: var(--bg); }

    .viewer-header {
      position: sticky;
      top: 0;
      z-index: 200;
      background: rgba(242,243,245,0.96);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--rule);
    }

    .viewer-header .container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 52px;
      gap: 1rem;
    }

    .viewer-title {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--ink-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .viewer-controls {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-shrink: 0;
    }

    .viewer-controls button {
      font-family: var(--mono);
      font-size: 0.68rem;
      padding: 0.25rem 0.6rem;
      border: 1px solid var(--rule);
      border-radius: 1px;
      background: var(--surface);
      color: var(--ink-soft);
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    .viewer-controls button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .viewer-controls button:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .page-indicator {
      font-family: var(--mono);
      font-size: 0.68rem;
      color: var(--ink-muted);
      white-space: nowrap;
    }

    .zoom-controls {
      display: flex;
      gap: 0.4rem;
    }

    .back-link {
      font-family: var(--mono);
      font-size: 0.68rem;
      color: var(--ink-muted);
      text-decoration: none;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .back-link:hover { color: var(--accent); }

    /* Canvas area */
    #pdf-container {
      padding: 1.5rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      min-height: calc(100vh - 52px);
    }

    .pdf-page-wrap {
      position: relative;
      box-shadow: 0 2px 16px rgba(27,31,59,0.1);
      border-radius: 2px;
      overflow: hidden;
      background: white;
    }

    .pdf-page-wrap canvas {
      display: block;
    }

    #loading {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--ink-muted);
      padding: 4rem 0;
      text-align: center;
    }

    #error {
      display: none;
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--vermillion);
      padding: 4rem 2rem;
      text-align: center;
      max-width: 500px;
      margin: 0 auto;
      line-height: 1.7;
    }
  </style>
</head>
<body class="page-thesis">

  <div class="viewer-header">
    <div class="container">
      <a class="back-link" id="back-link" href="../thesis.html">← thesis</a>
      <span class="viewer-title" id="viewer-title">loading...</span>
      <div class="viewer-controls">
        <div class="zoom-controls">
          <button onclick="zoom(-0.15)" title="zoom out">−</button>
          <button onclick="zoom(+0.15)" title="zoom in">+</button>
        </div>
        <button onclick="prevPage()" id="btn-prev" disabled>↑ prev</button>
        <span class="page-indicator" id="page-indicator">— / —</span>
        <button onclick="nextPage()" id="btn-next" disabled>next ↓</button>
        <button onclick="downloadPdf()" title="download">↓ pdf</button>
      </div>
    </div>
  </div>

  <div id="pdf-container">
    <div id="loading">loading pdf...</div>
    <div id="error">
      could not load the pdf. this may be a network issue — try refreshing.<br><br>
      <a href="../thesis.html">← back to thesis</a>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.mjs" type="module"></script>
  <script type="module">
    // PDF.js from cdnjs
    import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.mjs';
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.mjs';

    // Get PDF URL and title from query string
    const params = new URLSearchParams(window.location.search);
    const pdfUrl  = params.get('file');
    const title   = params.get('title') || 'thesis';

    document.getElementById('viewer-title').textContent = title;
    document.title = title + ' — aashrita mangu';

    if (!pdfUrl) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error').style.display = 'block';
    }

    let pdfDoc = null;
    let scale  = 1.4;
    let currentPage = 1;
    const container = document.getElementById('pdf-container');

    window.downloadPdf = function() {
      const a = document.createElement('a');
      a.href = pdfUrl;
      a.download = '';
      a.click();
    };

    window.zoom = function(delta) {
      scale = Math.min(Math.max(scale + delta, 0.6), 2.5);
      renderAll();
    };

    window.prevPage = function() {
      if (currentPage > 1) { currentPage--; scrollToPage(currentPage); }
    };
    window.nextPage = function() {
      if (pdfDoc && currentPage < pdfDoc.numPages) { currentPage++; scrollToPage(currentPage); }
    };

    function scrollToPage(n) {
      const el = document.getElementById(`page-${n}`);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function updateUI() {
      if (!pdfDoc) return;
      document.getElementById('page-indicator').textContent = `${currentPage} / ${pdfDoc.numPages}`;
      document.getElementById('btn-prev').disabled = currentPage <= 1;
      document.getElementById('btn-next').disabled = currentPage >= pdfDoc.numPages;
    }

    async function renderPage(n) {
      const page = await pdfDoc.getPage(n);
      const viewport = page.getViewport({ scale });

      let wrap = document.getElementById(`page-${n}`);
      if (!wrap) {
        wrap = document.createElement('div');
        wrap.className = 'pdf-page-wrap';
        wrap.id = `page-${n}`;
        container.appendChild(wrap);
      }

      let canvas = wrap.querySelector('canvas');
      if (!canvas) {
        canvas = document.createElement('canvas');
        wrap.appendChild(canvas);
      }

      const ctx = canvas.getContext('2d');
      canvas.width  = viewport.width;
      canvas.height = viewport.height;

      await page.render({ canvasContext: ctx, viewport }).promise;
    }

    async function renderAll() {
      // Clear existing canvases but keep wrappers for scroll position
      document.querySelectorAll('.pdf-page-wrap canvas').forEach(c => c.remove());
      const total = pdfDoc.numPages;
      for (let n = 1; n <= total; n++) {
        await renderPage(n);
      }
      updateUI();
    }

    // Intersection observer to track current page
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          const n = parseInt(e.target.id.replace('page-', ''));
          if (n) { currentPage = n; updateUI(); }
        }
      });
    }, { threshold: 0.3 });

    async function load() {
      try {
        const loadingTask = pdfjsLib.getDocument({
          url: pdfUrl,
          withCredentials: false,
        });

        pdfDoc = await loadingTask.promise;
        document.getElementById('loading').style.display = 'none';

        await renderAll();

        // Observe all pages for scroll tracking
        document.querySelectorAll('.pdf-page-wrap').forEach(el => observer.observe(el));

      } catch(e) {
        console.error('PDF load error:', e);
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').style.display = 'block';
      }
    }

    if (pdfUrl) load();
  </script>

  <script src="../assets/nav.js"></script>
</body>
</html>
